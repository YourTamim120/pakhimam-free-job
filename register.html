<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081225"><title>নিবন্ধন | PakhiMam</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page">
<header class="top wrap"><a class="brand" href="index.html"><span class="mark">P</span><span>PakhiMam<small>FREE JOB</small></span></a><a class="btn ghost" href="index.html">হোম</a></header>
<main class="auth-wrap"><section class="auth-card"><span class="eyebrow">CREATE ACCOUNT</span><h1>নতুন অ্যাকাউন্ট খুলুন</h1><p class="muted">সঠিক তথ্য দিয়ে নিবন্ধন সম্পন্ন করুন।</p>
<form id="registerForm"><label for="name">আপনার নাম</label><input id="name" type="text" autocomplete="name" required maxlength="60" placeholder="আপনার নাম"><label for="email">ইমেইল</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"><label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="new-password" required minlength="8" placeholder="কমপক্ষে ৮ অক্ষর"><label for="confirmPassword">পাসওয়ার্ড নিশ্চিত করুন</label><input id="confirmPassword" type="password" autocomplete="new-password" required minlength="8" placeholder="আবার পাসওয়ার্ড লিখুন"><button class="btn primary full" type="submit">নিবন্ধন সম্পন্ন করুন</button><p id="formMessage" class="form-message" role="status"></p></form>
<p class="auth-foot">আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a></p></section></main><script type="module" src="js/auth.js"></script></body></html>
