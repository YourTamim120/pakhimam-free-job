<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>নিবন্ধন | PakhiMam</title><link rel="stylesheet" href="css/style.css"></head><body><main class="auth-shell"><a class="brand auth-brand" href="index.html"><span class="mark">P</span><span>PakhiMam<small>FREE JOB</small></span></a><section class="panel"><span class="eyebrow">নতুন সদস্য</span><h1>অ্যাকাউন্ট তৈরি করুন</h1><p class="muted">নিচের তথ্য দিয়ে নিবন্ধন করুন। পাসওয়ার্ড নিরাপদ Auth সেবায় যাচাই হবে।</p><form id="registerForm"><div class="field"><label for="name">আপনার নাম</label><input id="name" autocomplete="name" maxlength="60" required placeholder="আপনার নাম লিখুন"></div><div class="field"><label for="email">ইমেইল ঠিকানা</label><input id="email" type="email" autocomplete="email" required placeholder="name@example.com"></div><div class="field"><label for="password">পাসওয়ার্ড</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="কমপক্ষে ৮ অক্ষর"></div><p class="hint">শক্তিশালী ও অন্য কোথাও ব্যবহার না করা পাসওয়ার্ড দিন। OTP বা পাসওয়ার্ড কাউকে দেবেন না।</p><button class="btn primary full" type="submit" id="submitBtn">নিবন্ধন করুন</button><div class="message" id="message" role="status"></div></form><p class="below">আগে থেকেই অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a></p></section><p class="back"><a href="index.html">← হোমপেজে ফিরুন</a> · <a href="https://t.me/PakhiMam">সাহায্য</a></p></main><script type="module" src="js/auth.js"></script></body></html>
